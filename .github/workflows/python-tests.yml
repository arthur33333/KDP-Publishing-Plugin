name: Python tests

on:
  push:
    branches: [main, v2-development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v

  typst-integration:
    name: Typst end-to-end publishing smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install pinned official Typst CLI v0.15.1
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import pathlib
          import tarfile
          import urllib.request

          headers = {"User-Agent": "KDP-Publishing-Plugin-CI"}
          request = urllib.request.Request(
              "https://api.github.com/repos/typst/typst/releases/tags/v0.15.1",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)

          candidates = [
              asset for asset in release["assets"]
              if asset["name"] in (
                  "typst-x86_64-unknown-linux-musl.tar.xz",
                  "typst-x86_64-unknown-linux-gnu.tar.xz",
              )
          ]
          if not candidates:
              raise SystemExit("No official x86_64 Linux Typst release archive found.")

          asset = next(
              (item for item in candidates if "musl" in item["name"]),
              candidates[0],
          )
          request = urllib.request.Request(asset["browser_download_url"], headers=headers)
          with urllib.request.urlopen(request, timeout=120) as response:
              archive_bytes = response.read()

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:xz") as archive:
              binary = next(
                  (member for member in archive.getmembers()
                   if pathlib.PurePosixPath(member.name).name == "typst"
                   and member.isfile()),
                  None,
              )
              if binary is None:
                  raise SystemExit("The Typst release archive contains no typst binary.")
              source = archive.extractfile(binary)
              if source is None:
                  raise SystemExit("Could not read the Typst binary from its archive.")
              destination = pathlib.Path.home() / ".local" / "bin" / "typst"
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(source.read())
              destination.chmod(0o755)

          print(f"Installed Typst {release['tag_name']} at {destination}")
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compile a complete sample paperback
        run: python tests/typst_smoke.py
